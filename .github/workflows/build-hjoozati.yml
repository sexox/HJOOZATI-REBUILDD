
name: HJOOZATI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'HJOOZATI_GITHUB_UPLOAD_READY.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="HJOOZATI_GITHUB_UPLOAD_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p /tmp/hjoozati-source
          unzip -q "$ZIP_FILE" -d /tmp/hjoozati-source

          PROJECT_DIR=$(find /tmp/hjoozati-source \
            -name settings.gradle.kts \
            -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts"
            exit 1
          fi

          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Android APK
        run: gradle :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HJOOZATI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
